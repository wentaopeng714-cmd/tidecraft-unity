<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#153d46"><meta name="description" content="沙岸工坊在线试玩：筑墙造塔，守护青色旗台，挡住三轮逐渐增强的海浪。"><title>沙岸工坊 · 在线试玩</title>
<style>
:root{color-scheme:light;--ink:#153d46;--cream:#fff3d5;--sand:#e8cc91;--teal:#70d3c2;--coral:#de7258}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif}main{width:100%;height:100dvh;display:grid;place-items:center}.stage{position:relative;height:100dvh;width:min(100vw,56.25dvh);background:#a5cdd0;overflow:hidden}canvas{display:block;width:100%;height:100%;outline:0;touch-action:none;user-select:none;-webkit-user-select:none}#cover{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,rgba(21,61,70,.88),rgba(21,61,70,.76)),url('cover.jpg') center/cover;transition:opacity .3s}#cover.hide{opacity:0;pointer-events:none}.intro{width:90%;max-width:420px;color:var(--cream);text-align:center;padding:20px 12px}.eyebrow{font-size:10px;letter-spacing:.32em;color:var(--teal);margin:0 0 24px}h1{font-size:clamp(28px,8vw,48px);letter-spacing:.08em;font-weight:600;line-height:1.15;margin:0 0 24px}.lead{font-size:15px;line-height:1.9;margin:0 0 28px;color:#f0e8cf}.features{display:flex;justify-content:center;gap:7px;margin:0 0 32px;flex-wrap:wrap}.features span{padding:7px 10px;border:1px solid #fff3d540;border-radius:100px;font-size:11px}button{font:inherit;border:0;border-radius:10px;background:var(--cream);color:var(--ink);font-weight:650;min-height:52px;min-width:180px;padding:0 30px;cursor:pointer;transition:transform .15s,background .15s}button:hover{background:var(--teal);transform:translateY(-2px)}button:focus-visible{outline:3px solid var(--teal);outline-offset:5px}button:disabled{cursor:wait;transform:none;background:#e2ddc8}.help{font-size:11px;line-height:1.9;opacity:.8;margin:24px auto 0;max-width:310px}.progress{height:5px;border-radius:8px;overflow:hidden;background:#fff3d52b;margin:22px auto 0;max-width:260px;display:none}.progress i{display:block;height:100%;width:0;background:var(--teal);transition:width .15s}#status{font-size:11px;min-height:20px;line-height:1.8;margin-top:14px;color:var(--cream)}@media(max-height:580px){.intro{padding:10px}.eyebrow{margin-bottom:12px}h1{font-size:28px;margin-bottom:15px}.lead{font-size:12px;margin-bottom:18px}.features,.help{display:none}.progress{margin-top:14px}button{min-width:150px;min-height:46px}}
</style></head><body>
<main><section class="stage" aria-label="沙岸工坊游戏"><canvas id="unity-canvas" tabindex="0" aria-label="沙滩建造游戏，单指或鼠标拖动建造，双指移动镜头"></canvas><div id="cover"><div class="intro"><p class="eyebrow">TIDECRAFT · PLAYGROUND</p><h1>沙岸工坊</h1><p class="lead">筑起防线，守住青色旗台。<br>挡住三轮海浪，让沙堡经受冲击。</p><div class="features"><span>筑墙挡浪</span><span>模具造塔</span><span>挖沟引水</span></div><button id="start" hidden>重新加载</button><div class="progress" style="display:block" role="progressbar" aria-label="游戏加载进度" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"><i></i></div><div id="status" role="status" aria-live="polite">正在下载游戏文件…</div><p class="help">电脑：左键建造 · 右键旋转 · 滚轮缩放<br>手机：单指使用工具 · 双指移动、缩放与旋转<br>作品保存在当前浏览器，可在游戏里保存和读取。</p></div></div></section></main>
<script>
const canvas=document.getElementById('unity-canvas'),cover=document.getElementById('cover'),button=document.getElementById('start'),status=document.getElementById('status'),bar=document.querySelector('.progress'),fill=bar.firstElementChild;
let started=false;
function progress(p){const n=Math.min(100,Math.round(p*100));fill.style.width=n+'%';bar.setAttribute('aria-valuenow',n);status.textContent='正在准备沙滩 '+n+'%';}
function fail(error){cover.classList.remove('hide');cover.removeAttribute('aria-hidden');console.error('[Tidecraft loader]',error);status.textContent='加载未完成，请检查网络后重试。';button.hidden=false;button.disabled=false;button.textContent='重新加载';canvas.dataset.loadError='true';}
async function loadGame(){if(started)return;started=true;button.hidden=true;canvas.dataset.autoStart='true';try{const build={"loaderUrl":"Build/unity-web-waves.loader.js","dataUrl":"Build/unity-web-waves.data","frameworkUrl":"Build/unity-web-waves.framework.js","codeUrl":"Build/unity-web-waves.wasm"};await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=build.loaderUrl;s.onload=resolve;s.onerror=reject;document.body.appendChild(s)});await createUnityInstance(canvas,{dataUrl:build.dataUrl,frameworkUrl:build.frameworkUrl,codeUrl:build.codeUrl,streamingAssetsUrl:'StreamingAssets',companyName:'Tidecraft Studio',productName:'沙岸工坊',productVersion:'0.3.0',autoSyncPersistentDataPath:true,dataCaching:false,devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5),showBanner:(message,type)=>{if(type==='error')fail(message);else console.warn(message)}},progress);if(canvas.dataset.loadError==='true')return;canvas.dataset.engineLoaded='true';cover.classList.add('hide');cover.setAttribute('aria-hidden','true');canvas.focus();}catch(e){fail(e)}}
button.addEventListener('click',()=>location.reload());
loadGame();
canvas.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{if(canvas===document.activeElement&&[' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault()});
</script></body></html>
